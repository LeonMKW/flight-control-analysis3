<!DOCTYPE html>
<html lang="en">
<style>
body {
    font-family: Arial, sans-serif;
    margin: 20px;
    background-color: #f4f4f9;
}

h1, h2 {
    color: #333;
}

form {
    margin-bottom: 20px;
}

form label {
    margin-right: 10px;
}

form input, form button {
    margin-right: 10px;
    padding: 5px;
}

#satIDCheckboxes {
    display: flex;
    flex-wrap: wrap;
    margin-bottom: 10px;
}

#satIDCheckboxes input[type="checkbox"] {
    margin-right: 5px;
}

#satIDCheckboxes label {
    margin-right: 15px;
}

.styled-table {
    width: 100%;
    border-collapse: collapse;
    margin: 25px 0;
    font-size: 18px;
    text-align: left;
}

.styled-table thead tr {
    background-color: #555;
    color: #ffffff;
}

.styled-table th,
.styled-table td {
    padding: 12px 15px;
    border: 1px solid #dddddd;
}

.styled-table tbody tr:nth-of-type(even) {
    background-color: #f3f3f3;
}

.styled-table tbody tr:nth-of-type(odd) {
    background-color: #e9e9e9;
}

.styled-table tbody tr:hover {
    background-color: #f1f1f1;
}

</style>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Satellite Data</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
    <h1>Satellite Data</h1>

    <form id="dataForm">
        <label for="start">Start Time:</label>
        <input type="datetime-local" id="start" name="start" required>

        <label for="end">End Time:</label>
        <input type="datetime-local" id="end" name="end" required>

        <label for="satID">Satellite ID:</label>
        <div id="satIDCheckboxes">
            <!-- Checkboxes for satID will be generated here by JavaScript -->
        </div>

        <button type="button" id="submitButton">Submit</button>
    </form>

    <h2>Flight Control</h2>
    <table id="flightControlTable" class="styled-table">
        <thead>
            <tr>
                <th>计划</th>
                <th>开始时间</th>
                <th>卫星代号</th>
                <th>测站名称</th>
                <th>发令计数</th>
                <th>星上正确指令计数增加</th>
                <th>通信情况</th>
                <th>文件巡检</th>
                <th>复位切机</th>
                <th>轨控</th>
                <th>公司名称</th>
            </tr>
        </thead>
        <tbody>
            <!-- Flight Control rows will be appended here -->
        </tbody>
    </table>

    <h2>Subsystems</h2>
    <table id="subsystemTable" class="styled-table">
        <thead>
            <tr>
                <th>Subsystem</th>
                <th>Count</th>
            </tr>
        </thead>
        <tbody>
            <!-- Subsystem rows will be appended here -->
        </tbody>
    </table>

    <h2>Levels</h2>
    <table id="levelTable" class="styled-table">
        <thead>
            <tr>
                <th>Subsystem</th>
                <th>FATAL</th>
                <th>CRITICAL</th>
                <th>WARNING</th>
                <th>INFO</th>
            </tr>
        </thead>
        <tbody>
            <!-- Level rows will be appended here -->
        </tbody>
    </table>

    <h2>Orbit</h2>
    <table id="orbitTable" class="styled-table">
        <thead>
            <tr>
                <th>SatID</th>
                <th>Perigee (mse)</th>
                <th>Altitude (km)</th>
            </tr>
        </thead>
        <tbody>
            <!-- Orbit rows will be appended here -->
        </tbody>
    </table>

<script src="{{url_for('static',filename='js/web_tool.js')}}"></script>
</body>
</html>
