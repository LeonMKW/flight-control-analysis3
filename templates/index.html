<!DOCTYPE html>
<html lang="en">
<link rel="icon" href="data:;base64,iVBORw0KGgo=">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://d3js.org/d3.v7.min.js"></script> <!-- Add this line to include D3.js -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.2.1/dist/echarts.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.1/moment.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment-timezone/0.5.34/moment-timezone-with-data.min.js"></script>
    <link rel="stylesheet" type="text/css" href="{{url_for('static',filename='style.css')}}">
    <title>Satellite Data</title>
<!--    <style>-->
<!--    @import url(style.css);-->
<!--    </style>-->
</head>
<body>
    <div class="tooltip" style="opacity:0;"></div>
    <h1>Satellite Data</h1>

    <form id="dataForm">
        <label for="start">Start Time:</label>
        <input type="datetime-local" id="start" name="start" required>

        <label for="end">End Time:</label>
        <input type="datetime-local" id="end" name="end" required>

        <label for="satID">Satellite ID:</label>
        <div id="satIDCheckboxes">
            <!-- Checkboxes for satID will be generated here by JavaScript -->
        </div>

        <button type="button" id="submitButton">Submit</button>
    </form>

    <div class="container">
        <h2>Flight Control</h2>
        <table id="flightControlTable" class="styled-table">
            <thead>
                <tr>
                    <th>卫星代号</th>
                    <th>计划</th>
                    <th>任务代号</th>
                    <th>开始时间</th>
                    <th>卫星名称</th>
                    <th>测站名称</th>
                    <th>发令计数</th>
                    <th>正确指令计数增加</th>
                    <th>通信情况</th>
                    <th>文件巡检</th>
                    <th>复位切机</th>
                    <th>轨控</th>
                    <th>公司名称</th>
                    <th class="track-quality">跟踪质量</th>
                </tr>
            </thead>
            <tbody>
                <!-- Flight Control rows will be appended here -->
                <tr>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
<!--                    <td class="color-column"><div></div></td>-->
                    <td></td>
                    <td></td>
                    <td class="track-quality"></td>
                </tr>
            </tbody>
        </table>


        <h2>Subsystems</h2>
        <table id="subsystemTable" class="styled-table">
            <thead>
                <tr>
                    <th>卫星代号</th>
                    <th>Subsystem</th>
                    <th>Count</th>
                    <th>Chart</th>
                </tr>
            </thead>
            <tbody>
                <!-- Subsystem rows will be appended here -->
            </tbody>
        </table>

        <h2>Orbit</h2>
        <table id="orbitTable" class="styled-table">
            <thead>
                <tr>
                    <th>卫星代号</th>
                    <th>Altitude (km)</th>
                    <th>phase (degree)</th>
                </tr>
            </thead>
            <tbody>
                <!-- Orbit rows will be appended here -->
            </tbody>
        </table>

        <div id="satelliteContainer" class="arc-container">
            <!-- SVGs will be appended here -->
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/web_tool.js') }}"></script>
</body>
</html>
