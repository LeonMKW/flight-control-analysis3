<!DOCTYPE html>
<html lang="en">
<link rel="icon" href="data:;base64,iVBORw0KGgo=">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://d3js.org/d3.v7.min.js"></script> <!-- Add this line to include D3.js -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.2.1/dist/echarts.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.1/moment.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment-timezone/0.5.34/moment-timezone-with-data.min.js"></script>
    <script src="https://registry.npmmirror.com/echarts/5.5.0/files/dist/echarts.min.js"></script>

    <link rel="stylesheet" type="text/css" href="{{url_for('static',filename='style.css')}}">
    <title>Satellite Data</title>
</head>
<body>
    <div class="header-container">
        <h1>银河小蜘蛛星座飞控日报
            <img src="/static/svg/gslogo.png" class="gs-logo" alt="GS Logo">
        </h1>
        <textarea id="textareaname" style="font-size: larger; font-weight: bold; width: 30%; height: 1.5em; overflow: hidden; text-indent: 0;">飞控值班人：
        </textarea>
    </div>
    <hr>

    <form id="dataForm">
        <label for="start">Start Time:</label>
        <input type="datetime-local" id="start" name="start" required>

        <label for="end">End Time:</label>
        <input type="datetime-local" id="end" name="end" required>

        <label for="satID">Satellite ID:</label>
        <div id="satIDCheckboxes">
            <!-- Checkboxes for satID will be generated here by JavaScript -->
        </div>

        <button type="button" id="submitButton">Submit</button>
    </form>

    <div class="container">
        <h2>今日飞控总结</h2>
         <textarea id="summaryTextarea1" class="summary-textarea"></textarea>
        <h3>飞控任务跟踪质量</h3>
        <table id="flightControlTable" class="styled-table">
            <thead>
                <tr>
                    <th>卫星代号</th>
                    <th>计划</th>
                    <th>开始时间</th>
                    <th>卫星名称</th>
                    <th>测站名称</th>
                    <th>发令计数</th>
                    <th>正确指令计数增加</th>
                    <th>通信情况</th>
                    <th>文件巡检</th>
                    <th>复位切机</th>
<!--                    <th class="track-quality">跟踪质量</th>-->
                </tr>
            </thead>
            <tbody>
                <!-- Flight Control rows will be appended here -->
                <tr>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
<!--                    <td class="track-quality"></td>-->
                </tr>
            </tbody>
        </table>
    </div>

    <div class="container">
        <div class="row">
            <div class="column">
                <div id="companyChart" class="chart"></div>
            </div>
            <div class="column">
                <h2>轨控活动</h2>
                <div id="fireRecordsTableContainer"></div>
            </div>
        </div>
        <div class="row">
<!--            <h2>卫星状态</h2>-->
<!--            <textarea>此处拼接卫星在轨状态</textarea>-->
            <div class="column">
                <h3>卫星在轨告警情况</h3>
                <table id="subsystemTable" class="styled-table">
                    <thead>
                        <tr>
                            <th>卫星代号</th>
                            <th>分系统</th>
                            <th>频率</th>
                            <th>等级</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Subsystem rows will be appended here -->
                    </tbody>
                </table>
            </div>
            <div class="column">
                <h3>02批6星复位情况</h3>
                <div id="cumulativeResetChart" class="chart"></div>
            </div>
        </div>
    </div>


    <div>
        <h2>小蜘蛛星座态势</h2>
        <div id="satelliteContainer" class="arc-container">
            <!-- SVGs will be appended here -->
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/web_tool.js') }}"></script>
</body>
</html>
