<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Satellite Data</title>
    <style>
        body {
            font-size: 12px;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }
        .styled-table {
            border-collapse: collapse;
            margin: 10px 0;
            font-size: 0.9em;
            min-width: 400px;
        }
        .styled-table th, .styled-table td {
            padding: 12px 15px;
            border: 1px solid #ddd;
        }
        .styled-table th {
            background-color: #f4f4f4;
        }
        .styled-table tbody tr {
            border-bottom: 1px solid #ddd;
        }
        .styled-table tbody tr:nth-of-type(even) {
            background-color: #f4f4f4;
        }
    </style>
</head>
<body>
    <h1>Satellite Data</h1>

    <form id="dataForm">
        <label for="start">Start Time:</label>
        <input type="datetime-local" id="start" name="start" required>

        <label for="end">End Time:</label>
        <input type="datetime-local" id="end" name="end" required>

        <label for="satID">Satellite ID:</label>
        <div id="satIDCheckboxes">
            <!-- Checkboxes for satID will be generated here by JavaScript -->
        </div>

        <button type="button" id="submitButton">Submit</button>
    </form>

    <div class="container">
        <h2>Flight Control</h2>
        <table id="flightControlTable" class="styled-table">
            <thead>
                <tr>
                    <th>卫星代号</th>
                    <th>计划</th>
                    <th>开始时间</th>
                    <th>测站名称</th>
                    <th>发令计数</th>
                    <th>星上正确指令计数增加</th>
                    <th>通信情况</th>
                    <th>文件巡检</th>
                    <th>复位切机</th>
                    <th>轨控</th>
                    <th>公司名称</th>
                </tr>
            </thead>
            <tbody>
                <!-- Flight Control rows will be appended here -->
            </tbody>
        </table>

        <h2>Subsystems</h2>
        <table id="subsystemTable" class="styled-table">
            <thead>
                <tr>
                    <th>卫星代号</th>
                    <th>Subsystem</th>
                    <th>Count</th>
                </tr>
            </thead>
            <tbody>
                <!-- Subsystem rows will be appended here -->
            </tbody>
        </table>

        <h2>Levels</h2>
        <table id="levelTable" class="styled-table">
            <thead>
                <tr>
                    <th>卫星代号</th>
                    <th>Subsystem</th>
                    <th>FATAL</th>
                    <th>CRITICAL</th>
                    <th>WARNING</th>
                    <th>INFO</th>
                </tr>
            </thead>
            <tbody>
                <!-- Level rows will be appended here -->
            </tbody>
        </table>

        <h2>Orbit</h2>
        <table id="orbitTable" class="styled-table">
            <thead>
                <tr>
                    <th>卫星代号</th>
                    <th>Perigee (mse)</th>
                    <th>Altitude (km)</th>
                </tr>
            </thead>
            <tbody>
                <!-- Orbit rows will be appended here -->
            </tbody>
        </table>
    </div>

    <script src="{{url_for('static',filename='js/web_tool.js')}}"></script>
</body>
</html>
